name: release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the tarball to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build tarball
        run: |
          npm pack
          mv dsh-swap-enter-*.tgz dsh-swap-enter.tgz
          ls -l dsh-swap-enter.tgz

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dsh-swap-enter.tgz --repo "$GITHUB_REPOSITORY" --clobber
